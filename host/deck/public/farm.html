<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pixelings Farm</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b0b0f;
        cursor: default;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
      }
      canvas {
        display: block;
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <canvas id="farm"></canvas>
    <script type="module" src="/farm.js"></script>
  </body>
</html>
