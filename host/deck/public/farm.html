<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pixelings Farm</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b0b0f;
        cursor: default;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
      }
      canvas {
        display: block;
        image-rendering: pixelated;
      }
      /* A Pixeling's right-click menu. */
      .menu {
        position: fixed;
        min-width: 110px;
        padding: 4px;
        background: #16161e;
        border: 1px solid #3a3a48;
        border-radius: 6px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
      }
      .menu button {
        display: block;
        width: 100%;
        padding: 5px 10px;
        border: 0;
        border-radius: 4px;
        background: none;
        color: #eee;
        font: 13px -apple-system, 'Segoe UI', sans-serif;
        text-align: left;
        cursor: default;
      }
      .menu button:hover {
        background: #3a6ee8;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <canvas id="farm"></canvas>
    <script type="module" src="/farm.js"></script>
  </body>
</html>
